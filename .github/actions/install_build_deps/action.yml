name: Install build dependencies
description: Installs dependencies needed for compilation

inputs:
  extra:
    description: Extra dependencies to install (linux only)
    required: false
    default: ""
  privileges:
    description: privileges required to run system-wide commands
    required: false
    default: ""
  cmake_generator:
    description: name of cmake generator to use
    required: false

runs:
  using: composite
  steps:
    - name: Update Linux packages
      run: |
        apt-get update
        apt-get install \
         -y cmake g++ git ${{ inputs.extra }}
      continue-on-error: true
      shell: bash

    - name: Install fmtlib
      shell: bash
      run: |
        git clone --depth 1 --branch 7.1.3 https://github.com/fmtlib/fmt.git fmt-7.1.3
        cmake                 \
          -S fmt-7.1.3        \
          -B fmt-7.1.3/build  \
          -DFMT_TEST=OFF      \
          -DFMT_DOC=OFF       \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          ${{ inputs.cmake_generator  }}

        ${{ inputs.privileges }} cmake  \
          --build fmt-7.1.3/build       \
          --target install              \
          --config Release
