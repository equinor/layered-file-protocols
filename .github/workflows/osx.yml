name: Build on MacOS
permissions: {}
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  macos_build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - macos-latest
    steps:
    - uses: actions/checkout@v6

    - uses: "./.github/actions/install_build_deps"
      with:
        privileges: sudo

    - name: Build and test
      uses: "./.github/actions/cmake_build_and_test"
      with:
        cmake_cmd_prefix: sudo
